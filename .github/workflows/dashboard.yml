name: עדכון הדשבורד

on:
  schedule:
    # GitHub מתזמן לפי UTC. 05:00–15:00 UTC מכסה את 08:00–17:00 בישראל גם בחורף וגם בקיץ.
    # השלב הראשון מדלג על ריצות שנופלות מחוץ לשעות ולימים האלה בשעון ישראל.
    - cron: "0 5-15 * * 0-4"
  workflow_dispatch: {}   # כפתור "Run workflow" לעדכון ידני
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: בדיקת שעה בישראל
        id: gate
        run: |
          HOUR=$(TZ=Asia/Jerusalem date +%-H)
          DOW=$(TZ=Asia/Jerusalem date +%u)   # 7 = ראשון, 1–4 = שני עד חמישי
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$HOUR" -lt 8 ] || [ "$HOUR" -gt 17 ] || [ "$DOW" = 5 ] || [ "$DOW" = 6 ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "בישראל עכשיו יום $DOW, שעה $HOUR. מחוץ לשעות העדכון, מדלגים."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: התקנה
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: בניית הדשבורד מהגיליון
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/build.py

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: הצפנה בסיסמה
        if: steps.gate.outputs.run == 'true'
        env:
          STATICRYPT_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SALT: ${{ secrets.STATICRYPT_SALT }}
        run: |
          npx --yes staticrypt@3.5.4 dist/index.html -d _site -s "$SALT" -c false --short --remember 30 \
            --template-title "דרים איילנד · דשבורד ביקורות" \
            --template-instructions "הדשבורד מוגן בסיסמה" \
            --template-button "כניסה" \
            --template-placeholder "סיסמה" \
            --template-remember "לזכור אותי במכשיר הזה" \
            --template-error "הסיסמה שגויה. נסו שוב." \
            --template-color-primary "#111827" \
            --template-color-secondary "#F6F7F9"
          rm -rf dist

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: _site

      - name: פרסום
        id: deploy
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v4
